<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Buddy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <ul>
        <li><a href="index.html">&#8592; Back</a></li>
        <li class="push-right"><p>Your Trip</p></li>
    </ul>

<div class="flight-container">

    <div class="airport-graphic">
        <div class="flight-route">
            <div class="flight-line"></div>
            
            <div class="flight flight-top"></div>
            <div class="flight flight-middle"></div>

            <div class="airport-box">
                <p>LAX</p>
            </div>
        </div>    
    </div>

    <div class="time-box">
        <p>9:15a earliest</p>
        <p style="color: #ffffff">9:20a scheduled departure</p>
        <p>10:05a latest - 45m late</p>
        <p>2h 55m scheduled in the air</p>
    </div>

</div>

<p style="color: #737C89; text-align: center;">2h 55m scheduled in the air</p>

<div class="flight-container">

    <div class="airport-graphic">
        <div class="flight-route">
            <div class="flight-line"></div>
            
            <div class="flight flight-top"></div>
            <div class="flight flight-middle"></div>

            <div class="airport-box">
                <p>DEN</p>
            </div>
        </div>    
    </div>

    <div class="time-box">
        <p>10:05a earliest - 35m early</p>
        <p style="color: #ffffff">10:40a scheduled departure</p>
        <p>11:55a latest - 75m late - 20m past pushback</p>
        <p>2h 55m scheduled in the air</p>
    </div>

</div>

<hr class="horizontal-line">


</body>
</html>
