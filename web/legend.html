<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="utf-8">
<title>Travel Buddy globe</title>
<link rel="stylesheet" href="css/globe.css">

<div id="legend-small">
    <div class="period" id="period">All seasons</div>
    <div class="sub">Oct 2025 – Jul 2026 · US domestic</div>

    <div class="title">Colour — flights disrupted</div>
    <div class="key">
        <div class="ramp"></div>
        <div class="ticks">
            <span>70%<em>worst</em></span>
            <span>35%</span>
            <span>0%<em>best</em></span>
        </div>
    </div>
    
    <div class="title">Thickness — flights flown</div>
    <div class="thick">
        <i style="width:22px;height:1px"></i><em>few</em>
        <i style="width:22px;height:4px"></i><em>many</em>
    </div>

    <div class="note">Disrupted = arrived 15+ min late, diverted, or cancelled (BTS)</div>
    <div class="hint">M — season &nbsp;·&nbsp; P — flight paths &nbsp;·&nbsp; A — airports</div>
</div>
