<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="utf-8">
<title>Travel Buddy globe</title>
<link rel="stylesheet" href="css/globe.css">

<div id="globe"></div>



<div id="nav">
    <button onclick="view('us')">United States</button>
    <button onclick="view('west')">West coast</button>
    <button onclick="view('globe')">Whole globe</button>
    <div class="pair">
        <button onclick="zoom(0.7)">+</button>
        <button onclick="zoom(1.4)">−</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
<script src="js/globe.js"></script>
