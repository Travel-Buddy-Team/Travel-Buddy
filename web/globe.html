<!doctype html>
<meta charset="utf-8">
<title>Travel buddy globe
</title>
<style>
    html,
    body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden
    }

    #globe {
        width: 100vw;
        height: 100vh
    }
</style>
<div id="globe"></div>
<script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
<script>
    const world = Globe()(document.getElementById('globe'))
        .globeImageUrl('img/Earth4kTexture.png')
        .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
        .backgroundColor('#000')
        .showAtmosphere(true)
        .atmosphereColor('#6cc5ff')
        .atmosphereAltitude(0.18)
        .arcAltitude(d => 0.03 + d.rate * 0.08)            // TODO choose an option. OPTION ONE: disruption rate drives height. arcs separate vertical + bad routes arc higher off surface
        // .arcAltitude(d => 0.08 + d.rate * 0.25 + (d.flights % 7) * 0.004) // OPTION TWO: deterministic nudge so no two land at exactly the same height

    world.globeMaterial().bumpScale = 2;
    world.globeMaterial().shininess = 12;

    fetch('fixtures/paths.json')
        .then(r => r.json())
        .then(paths => {
            world
                .pathsData(paths)
                .pathPoints('points')
                .pathPointLat(p => p[0])
                .pathPointLng(p => p[1])
                .pathPointAlt(0.005)
                .pathColor(() => '#ffd166')
                .pathStroke(1.5)
                .pathLabel(d => `${d.route} - ${d.callsign} - ${(d.deviationPct * 100).toFixed(1)}% longer than direct`);
        })
        .catch(e => console.error('paths failed to load:', e));
</script>
