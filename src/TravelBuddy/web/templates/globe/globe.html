<!DOCTYPE html>
<head>
    <meta charset="utf-8">
    <title>Travel Buddy globe</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='globe/globe.css') }}">
</head>
<body>
    <div id="globe"></div>
    <div id="legend">
        <div class="period" id="period">All seasons</div>
        <div class="sub">Oct 2025 – Jul 2026 · US domestic</div>
        <div class="title">Colour — flights disrupted</div>
        <div class="key">
            <div class="ramp"></div>
            <div class="ticks">
                <span>70%<em>worst</em></span>
                <span>35%</span>
                <span>0%<em>best</em></span>
            </div>
        </div>
        <div class="title">Thickness — flights flown</div>
        <div class="thick">
            <i style="width:22px;height:1px"></i><em>few</em>
            <i style="width:22px;height:4px"></i><em>many</em>
        </div>
        <div class="note">Disrupted = arrived 15+ min late, diverted, or cancelled (BTS)</div>
        <div class="hint">M — season &nbsp;·&nbsp; P — flight paths &nbsp;·&nbsp; A — airports</div>
    </div>
    <div id="nav">
        <button onclick="view('us')">United States</button>
        <button onclick="view('west')">West coast</button>
        <button onclick="view('globe')">Whole globe</button>
        <div class="pair">
            <button onclick="zoom(0.7)">+</button>
            <button onclick="zoom(1.4)">−</button>
        </div>
    </div>
    <input type="hidden"
           id="globe-img-url"
           value="{{ url_for('static', filename='globe/Earth4kTexture.png') }}">
    <input type="hidden" id="earth-topology-url" value="#">
    <input type="hidden"
           id="fixtures-arcs-url"
           value="{{ url_for('static', filename='globe/fixtures/arcs.json') }}">
    <input type="hidden"
           id="fixtures-paths-url"
           value="{{ url_for('static', filename='globe/fixtures/paths.json') }}">
    <script defer src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
    <script defer src="{{ url_for('static', filename='globe/globe.js') }}"></script>
</body>
